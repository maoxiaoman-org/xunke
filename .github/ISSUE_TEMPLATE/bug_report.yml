name: 问题反馈 / Bug report
description: 报告安装、登录、地图搜索或导出过程中遇到的问题。
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。这里的内容和附件对所有人可见，请先隐藏真实客户资料、验证码、密码等信息。
        Please remove private information before posting. Do not include passwords or verification codes.
  - type: dropdown
    id: platform
    attributes:
      label: 操作系统 / Operating system
      options:
        - macOS（Apple 芯片 / Apple silicon）
        - Windows（x64）
        - 其他或不确定 / Other or unsure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 软件版本 / App version
      description: 填写安装包版本；不清楚时填写“不确定”。
      placeholder: 例如 1.2.3，或“不确定”
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤 / Steps to reproduce
      description: 从打开软件开始，说明怎样触发这个问题。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果 / Expected and actual behavior
      description: 你原本希望发生什么？实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional context
      description: 可附报错文字或打码后的截图；请勿上传整份客户名单、账号数据库或未经处理的日志。
